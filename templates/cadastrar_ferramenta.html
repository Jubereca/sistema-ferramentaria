<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Ferramenta - Mizu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f5f5f5; display: flex; flex-direction: column; min-height: 100vh; }

        .header-top {
            background: white; padding: 0 40px; display: flex;
            align-items: center; justify-content: space-between;
            height: 80px; border-bottom: 3px solid #ff6600;
        }
        .mizu-logo img { height: 55px; }
        .polimix-logo img { height: 28px; }

        .main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }

        .card {
            background: white; border-radius: 10px; padding: 35px 40px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 100%; max-width: 550px;
            border-top: 5px solid #ff6600;
        }
        .card h2 { font-size: 20px; color: #333; margin-bottom: 25px; text-align: center; }
        .card h2 span { color: #ff6600; }

        label { display: block; font-size: 12px; font-weight: 700; color: #555; text-transform: uppercase; margin-bottom: 5px; margin-top: 16px; }
        input, textarea {
            width: 100%; padding: 11px; border: 1px solid #ddd;
            border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none;
        }
        input:focus, textarea:focus { border-color: #ff6600; }
        textarea { height: 80px; resize: vertical; }

        .linha { display: flex; gap: 15px; }
        .linha > div { flex: 1; }

        .btn-salvar {
            width: 100%; padding: 14px; background: #ff6600; color: white;
            border: none; border-radius: 6px; font-size: 15px; font-weight: bold;
            cursor: pointer; margin-top: 25px;
        }
        .btn-salvar:hover { background: #e65c00; }
        .btn-voltar {
            display: block; text-align: center; margin-top: 12px;
            color: #888; text-decoration: none; font-size: 13px;
        }
        .btn-voltar:hover { color: #ff6600; }
        .flash { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

<header class="header-top">
    <div class="mizu-logo"><img src="{{ url_for('static', filename='img/mizu-1.png') }}" alt="Mizu"></div>
    <div class="polimix-logo"><img src="{{ url_for('static', filename='img/polimix-1.png') }}" alt="Polimix"></div>
</header>

<div class="main">
    <div class="card">
        <h2>CADASTRAR <span>FERRAMENTA</span></h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="flash">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('salvar_ferramenta') }}" method="POST">
            <label>Código da Ferramenta</label>
            <input type="text" name="codigo" placeholder="Ex: M006075028" required>

            <label>Nome da Ferramenta</label>
            <input type="text" name="nome" placeholder="Ex: FURADEIRA DE IMPACTO; 750W" required>

            <div class="linha">
                <div>
                    <label>Marca</label>
                    <input type="text" name="marca" placeholder="Ex: Bosch">
                </div>
                <div>
                    <label>Quantidade</label>
                    <input type="number" name="quantidade" value="1" min="1">
                </div>
            </div>

            <label>Obs. Técnicas</label>
            <textarea name="observacoes" placeholder="Informações adicionais sobre a ferramenta..."></textarea>

            <button type="submit" class="btn-salvar">Cadastrar Ferramenta</button>
        </form>
        <a href="{{ url_for('ver_ferramentas') }}" class="btn-voltar">Voltar ao Painel</a>
    </div>
</div>

</body>
</html>
