<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mizu - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        
        body { 
            background-color: #f5f5f5; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        /* CABEÇALHO COM AS LOGOS */
        .header {
            background-color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff6600;
            width: 100%;
        }
        .header img { height: 45px; }

        /* CONTAINER CENTRAL */
        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.08);
            width: 380px;
            text-align: center;
        }

        .login-card h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            color: #333;
        }

        .btn-entrar {
            width: 100%;
            padding: 12px;
            background-color: #ff6600;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .footer-links {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .footer-links a {
            color: #ff6600;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header class="header">
        <img src="{{ url_for('static', filename='img/mizu-2.png') }}" alt="Mizu Cimentos">
        <img src="{{ url_for('static', filename='img/polimix-1.png') }}" alt="Polimix Agregados">
    </header>

    <div class="login-container">
        <div class="login-card">
            <h2>Login</h2>

{% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for msg in messages %}
            <div style="background:#ffebee; color:#c62828; padding:10px 14px; border-radius:6px; margin-bottom:15px; font-size:14px; border-left:4px solid #c62828;">
                ⚠️ {{ msg }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}

<form action="/login" method="POST">
            
            <form action="/login" method="POST">
                <div class="form-group">
                    <input type="text" name="usuario" placeholder="Usuário" required>
                </div>

                <div class="form-group">
                    <input type="password" name="senha" placeholder="Senha" required>
                </div>

                <button type="submit" class="btn-entrar">Entrar</button>
            </form>

            <div class="footer-links">
                Novo por aqui? <a href="{{ url_for('novo_cadastro') }}">Solicitar Acesso</a>
            </div>
        </div>
    </div>

</body>
</html>
