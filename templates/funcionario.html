<!DOCTYPE html>
<html>
<head><title>Mizu - Funcionário</title></head>
<body style="background:#f4f4f4; font-family:sans-serif; padding:20px;">
    <h1>OLÁ, {{ nome.upper() }}!</h1>
    <p>Use o formulário abaixo para registrar que pegou uma ferramenta.</p>
    
    <form action="/registrar" method="POST" style="background:white; padding:20px; border:1px solid #ccc;">
        ID da Ferramenta: <input type="text" name="codigo" required><br><br>
        <button type="submit" style="background:green; color:white;">REGISTRAR RETIRADA</button>
    </form>

    <h3>Itens Disponíveis:</h3>
    <table border="1">
        {% for f in ferramentas %}
        <tr><td>{{ f[0] }}</td><td>{{ f[1] }}</td><td>{{ f[2] }}</td></tr>
        {% endfor %}
    </table>
</body>
</html>
